<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17231d">
<title>Shogi Web — オンライン将棋</title>
<style>
:root{color-scheme:dark;--bg:#101713;--panel:#1b2820;--panel2:#23342a;--line:#34483a;--gold:#d8b46a;--text:#f2f2e9;--muted:#b6c3b7;--wood:#d9ad68;--wood2:#c9944c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#23372a 0,#101713 58%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100vh}
header{padding:22px 16px 12px;text-align:center}h1{margin:0;font-size:clamp(24px,4vw,34px);letter-spacing:.08em}header p{margin:7px 0 0;color:var(--muted);font-size:13px}
main{width:min(1120px,100%);margin:auto;padding:12px 16px 32px;display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,.88fr);gap:18px}
.panel{background:linear-gradient(150deg,#1d2b22,#17221b);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 32px #0003;min-width:0}
h2{font-size:15px;margin:0 0 12px;color:#f0d59b;letter-spacing:.05em}
.connection{display:grid;gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:130px}
input,button{font:inherit;border-radius:10px;border:1px solid #435848;padding:10px 12px;background:#101a14;color:var(--text)}button{cursor:pointer;background:#304b38;border-color:#496b51;font-weight:650;transition:.15s}button:hover{filter:brightness(1.15)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#d6b36d;color:#1c241b;border-color:#e8ca88}.small{font-size:12px;padding:7px 10px}.status{border-radius:10px;background:#101a14;padding:10px 12px;color:var(--muted);font-size:13px;min-height:40px;line-height:1.5}.status.good{color:#b8edc1}.status.bad{color:#ffc1b5}
.gamehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.turn{font-weight:800;color:#f0d59b}.meta{font-size:12px;color:var(--muted)}
.board-wrap{width:min(100%,570px);margin:0 auto}.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));aspect-ratio:1;background:var(--wood);border:3px solid #986a32;box-shadow:0 8px 20px #0004;touch-action:manipulation}
.cell{border:1px solid #9d7138;background:linear-gradient(145deg,#e8c17d,#d8ab62);display:flex;align-items:center;justify-content:center;position:relative;padding:0;min-width:0;min-height:0;border-radius:0;color:#2d2116}
.cell.selected{background:#f7df94;box-shadow:inset 0 0 0 3px #fff0a6}.cell.legal:after{content:"";width:24%;height:24%;border-radius:50%;background:#526f42aa;position:absolute}.cell.last{background:#e7c97c}.piece{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:900;font-size:clamp(16px,3.5vw,31px);line-height:1;position:relative;z-index:1;user-select:none}.piece.white{transform:rotate(180deg)}.piece.promoted{color:#8b2f1f}
.captures{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.hand{border:1px solid var(--line);border-radius:12px;padding:9px;min-height:68px}.hand-title{font-size:12px;color:var(--muted);margin-bottom:6px}.hand-items{display:flex;flex-wrap:wrap;gap:5px}.hand button{background:#344332;color:#f7e6bd;padding:5px 7px;min-width:34px}.hand button.active{outline:2px solid var(--gold)}.hand button:disabled{opacity:.35}
.rules{font-size:12px;color:var(--muted);line-height:1.7;margin-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:760px){main{grid-template-columns:1fr;padding:10px}.panel{padding:13px}header{padding-top:18px}.board-wrap{width:min(100%,540px)}.piece{font-size:clamp(15px,5.2vw,29px)}}
</style>
</head>
<body>
<header><h1>SHOGI <span style="color:var(--gold)">WEB</span> <span id="updateNumber" style="font-size:.55em;letter-spacing:0;color:var(--muted);vertical-align:middle">4</span></h1><p>オンライン対局も、同じ端末での対面対局も</p><div class="row" style="justify-content:center;margin-top:12px"><button id="onlineModeBtn" class="small primary">オンライン対局</button><button id="localModeBtn" class="small">対面対局（1台で対局）</button></div></header>
<main>
<section class="panel">
<h2>ONLINE MATCH</h2>
<div class="connection">
<div class="row"><button id="hostBtn" class="primary">対局部屋を作る（先手）</button><button id="copyBtn" class="small" disabled>コードをコピー</button></div>
<div class="row"><input id="peerId" placeholder="相手の部屋コードを入力" autocomplete="off"><button id="joinBtn">参加（後手）</button></div>
<div class="status" id="netStatus">「対局部屋を作る」を押して、表示されたコードを相手に送ってください。</div>
<div class="row"><span class="meta">あなたのコード：</span><strong id="myId" style="overflow-wrap:anywhere">未作成</strong></div>
</div>
<div class="rules">通信は PeerJS の公開接続仲介サービスと WebRTC を利用します。両方の端末でこのページを開き、片方が部屋を作り、もう片方がコードを入力します。ネットワークや仲介サービスの状態によって接続できない場合があります。</div>
</section>
<section class="panel">
<div class="gamehead"><div><div class="turn" id="turnLabel">先手の番</div><div class="meta" id="gameMeta">相手と接続して対局開始</div></div><button id="resetBtn" class="small">盤面を初期化</button></div>
<div class="board-wrap"><div class="board" id="board" aria-label="将棋盤"></div></div>
<div class="captures">
<div class="hand"><div class="hand-title">先手の持ち駒</div><div class="hand-items" id="handB"></div></div>
<div class="hand"><div class="hand-title">後手の持ち駒</div><div class="hand-items" id="handW"></div></div>
</div>
<div class="actions"><button id="cancelBtn" class="small">選択解除</button><button id="declareBtn" class="small">入玉宣言</button><span class="meta" id="moveHint">自分の駒を選んで移動先をタップ</span></div>
</section>
</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
"use strict";
const names={K:"玉",R:"飛",B:"角",G:"金",S:"銀",N:"桂",L:"香",P:"歩"};
const glyph={K:"玉",R:"飛",B:"角",G:"金",S:"銀",N:"桂",L:"香",P:"歩","+R":"龍","+B":"馬","+S":"全","+N":"圭","+L":"杏","+P":"と"};
const initial=[
["L","N","S","G","K","G","S","N","L"],
[null,"R",null,null,null,null,null,"B",null],
["P","P","P","P","P","P","P","P","P"],
[null,null,null,null,null,null,null,null,null],
[null,null,null,null,null,null,null,null,null],
[null,null,null,null,null,null,null,null,null],
["P","P","P","P","P","P","P","P","P"],
[null,"B",null,null,null,null,null,"R",null],
["L","N","S","G","K","G","S","N","L"]
];
let board=[],hands={b:[],w:[]},turn="b",role=null,peer=null,conn=null,selected=null,selectedHand=null,legal=[],lastMove=null,gameStarted=false,gameOver=null,moveNo=1,connectionGeneration=0,positionHistory=[],localMode=false;
const $=id=>document.getElementById(id);
const clone=x=>JSON.parse(JSON.stringify(x));
function fresh(shouldRender=true){board=Array.from({length:9},()=>Array(9).fill(null));for(let r=0;r<9;r++)for(let c=0;c<9;c++){const p=initial[r][c];if(p)board[r][c]={p,s:r<3?"w":"b"};}hands={b:[],w:[]};turn="b";selected=null;selectedHand=null;legal=[];lastMove=null;gameOver=null;moveNo=1;positionHistory=[{key:positionKey(),mover:null,gaveCheck:false}];if(shouldRender)render();}
function status(msg,type=""){const el=$("netStatus");el.textContent=msg;el.className="status "+type;}
function send(obj){if(conn&&conn.open){try{conn.send(obj);return true;}catch(e){status("通信の送信に失敗しました。接続を確認してください。","bad");}}return false;}
function snapshot(){return {board:clone(board),hands:clone(hands),turn,lastMove:clone(lastMove),moveNo,gameOver,positionHistory:clone(positionHistory)};}
function applySnapshot(s){if(!s||!Array.isArray(s.board)||s.board.length!==9||!s.hands||!["b","w"].includes(s.turn))return;board=clone(s.board);hands=clone(s.hands);turn=s.turn;lastMove=s.lastMove||null;moveNo=s.moveNo||1;gameOver=s.gameOver||null;positionHistory=Array.isArray(s.positionHistory)&&s.positionHistory.length?s.positionHistory:[{key:positionKey(),mover:null,gaveCheck:false}];selected=null;selectedHand=null;legal=[];gameStarted=!gameOver;render();}
function resetAuthoritative(){fresh(false);gameStarted=!!(conn&&conn.open);render();broadcastState();}
function broadcastState(){send({type:"state",state:snapshot()});}
function setConnected(c,isHost,generation){conn=c;c.on("open",()=>{if(generation!==connectionGeneration)return;gameStarted=true;status("接続しました。対局を開始できます。","good");$("gameMeta").textContent="オンライン対局中";if(isHost)broadcastState();else send({type:"ready"});render();});c.on("data",m=>{if(generation!==connectionGeneration||!m)return;
if(isHost){
 if(m.type==="moveRequest"){if(gameOver||m.move?.side!=="w"||turn!=="w")return;const accepted=validateAndApply(m.move,"w");if(accepted)broadcastState();else send({type:"reject",message:"その手はルール上指せません。盤面を同期しました。",state:snapshot()});}
 else if(m.type==="resetRequest"){resetAuthoritative();}
 else if(m.type==="declarationRequest"){if(!gameOver&&m.side==="w"&&turn==="w"&&canDeclareEnteringKing("w")){gameOver={winner:"w",reason:"入玉宣言成立"};gameStarted=false;render();broadcastState();status("後手の入玉宣言が成立しました。","good");}else send({type:"reject",message:"入玉宣言の条件を満たしていません。",state:snapshot()});}
 else if(m.type==="ready"||m.type==="resync"){broadcastState();}
}else{
 if(m.type==="state"){applySnapshot(m.state);if(gameStarted)status("対局状態を同期しました。","good");}
 else if(m.type==="reject"){if(m.state)applySnapshot(m.state);status(m.message||"その手は受け付けられませんでした。","bad");}
 else if(m.type==="resetAck"){applySnapshot(m.state);}
 }
});c.on("close",()=>{if(generation!==connectionGeneration)return;gameStarted=false;status("相手との接続が切れました。部屋を作り直すか、再接続してください。","bad");$("gameMeta").textContent="切断";render();});c.on("error",e=>{if(generation===connectionGeneration)status("通信エラー："+(e.message||"接続を確認してください"),"bad");});}
function closeCurrent(){connectionGeneration++;if(conn){try{conn.close();}catch(e){}conn=null;}if(peer){try{peer.destroy();}catch(e){}peer=null;}gameStarted=false;role=null;$("myId").textContent="未作成";$("copyBtn").disabled=true;}
$("hostBtn").onclick=()=>{if(!window.Peer){status("通信ライブラリを読み込めませんでした。ページを再読み込みしてください。","bad");return;}closeCurrent();const generation=connectionGeneration;role="b";fresh();status("対局部屋を準備しています…");peer=new Peer();peer.on("open",id=>{if(generation!==connectionGeneration)return;$("myId").textContent=id;$("copyBtn").disabled=false;status("部屋を作成しました。コードを相手に送ってください。","good");});peer.on("connection",c=>{if(generation!==connectionGeneration){c.close();return;}if(conn&&conn.open){c.close();return;}setConnected(c,true,generation);status("相手が接続しました。通信を確立しています…");});peer.on("error",e=>{if(generation===connectionGeneration)status("部屋作成エラー："+(e.message||"時間をおいて再試行してください"),"bad");});};
$("copyBtn").onclick=async()=>{const id=$("myId").textContent;if(!id||id==="未作成")return;try{await navigator.clipboard.writeText(id);status("部屋コードをコピーしました。","good");}catch(e){$("peerId").value=id;status("コードを入力欄に表示しました。長押ししてコピーしてください。");}};
$("joinBtn").onclick=()=>{const id=$("peerId").value.trim();if(!id){status("相手の部屋コードを入力してください。","bad");return;}if(!window.Peer){status("通信ライブラリを読み込めませんでした。再読み込みしてください。","bad");return;}closeCurrent();const generation=connectionGeneration;role="w";fresh();status("接続しています…");peer=new Peer();peer.on("open",()=>{if(generation!==connectionGeneration)return;$("myId").textContent=peer.id;conn=peer.connect(id,{reliable:true});setConnected(conn,false,generation);});peer.on("error",e=>{if(generation===connectionGeneration)status("接続エラー："+(e.message||"コードやネットワークを確認してください"),"bad");});};
$("onlineModeBtn").onclick=()=>{localMode=false;closeCurrent();fresh();$("onlineModeBtn").classList.add("primary");$("localModeBtn").classList.remove("primary");$("hostBtn").disabled=false;$("copyBtn").disabled=true;$("joinBtn").disabled=false;$("peerId").disabled=false;$("gameMeta").textContent="相手と接続して対局開始";status("オンライン対局モードです。部屋を作るか、相手のコードを入力してください。");render();};
$("localModeBtn").onclick=()=>{closeCurrent();localMode=true;role=null;fresh(false);gameStarted=true;gameOver=null;$("localModeBtn").classList.add("primary");$("onlineModeBtn").classList.remove("primary");$("hostBtn").disabled=true;$("copyBtn").disabled=true;$("joinBtn").disabled=true;$("peerId").disabled=true;$("myId").textContent="対面対局";status("対面対局を開始しました。先手・後手が同じ端末で交互に操作してください。","good");render();};
$("resetBtn").onclick=()=>{if(!confirm("盤面を初期状態に戻しますか？"))return;if(localMode){fresh(false);gameStarted=true;render();status("対面対局の盤面を初期化しました。","good");return;}if(!role){fresh();return;}if(!conn||!conn.open){fresh();status("盤面を初期化しました。相手に接続していないため、相手側には同期されていません。");return;}if(role==="b")resetAuthoritative();else send({type:"resetRequest"});};
$("cancelBtn").onclick=()=>{selected=null;selectedHand=null;legal=[];render();};$("declareBtn").onclick=declareEnteringKing;
function positionKey(){const b=board.map(row=>row.map(p=>p?p.s+p.p:"--").join(",")).join("/");const h=["b","w"].map(s=>s+":"+["R","B","G","S","N","L","P"].map(p=>p+hands[s].filter(x=>x===p).length).join(",")).join("|");return b+"|"+h+"|"+turn;}
function inBoard(r,c){return r>=0&&r<9&&c>=0&&c<9;}
function ownerAt(r,c){return inBoard(r,c)?board[r][c]?.s||null:null;}
function forward(s){return s==="b"?-1:1;}
function promoted(p){return !!p&&p[0]==="+";}
function base(p){return promoted(p)?p.slice(1):p;}
function canPromote(p,s,fromR,toR){return ["R","B","S","N","L","P"].includes(base(p))&&(s==="b"?(fromR<=2||toR<=2):(fromR>=6||toR>=6));}
function mandatory(p,s,toR){const b=base(p),f=forward(s);if((b==="P"||b==="L")&&(toR+f<0||toR+f>8))return true;if(b==="N"&&(toR+2*f<0||toR+2*f>8))return true;return false;}
function addStep(out,r,c,dr,dc,s){const nr=r+dr,nc=c+dc;if(inBoard(nr,nc)&&ownerAt(nr,nc)!==s)out.push({r:nr,c:nc});}
function addRay(out,r,c,dr,dc,s){let nr=r+dr,nc=c+dc;while(inBoard(nr,nc)){if(ownerAt(nr,nc)===s)break;out.push({r:nr,c:nc});if(ownerAt(nr,nc))break;nr+=dr;nc+=dc;}}
function pseudoMoves(r,c){const piece=board[r]?.[c];if(!piece)return [];const p=piece.p,s=piece.s,b=base(p),f=forward(s),out=[];
const step=(dr,dc)=>addStep(out,r,c,dr,dc,s),ray=(dr,dc)=>addRay(out,r,c,dr,dc,s);
if(b==="K"){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)step(dr,dc);}
else if(b==="G"||["+S","+N","+L","+P"].includes(p)){[[-1,0],[0,-1],[0,1],[1,0],[-1,-1],[-1,1]].forEach(([dr,dc])=>step(dr*f,dc));}
else if(b==="S"){[[-1,0],[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([dr,dc])=>step(dr*f,dc));}
else if(b==="N"){step(2*f,-1);step(2*f,1);}
else if(b==="L")ray(f,0);
else if(b==="P")step(f,0);
else if(b==="R"){ray(1,0);ray(-1,0);ray(0,1);ray(0,-1);if(p==="+R"){step(1,1);step(1,-1);step(-1,1);step(-1,-1);}}
else if(b==="B"){ray(1,1);ray(1,-1);ray(-1,1);ray(-1,-1);if(p==="+B"){step(1,0);step(-1,0);step(0,1);step(0,-1);}}
return out;}
function isAttacked(r,c,bySide){for(let rr=0;rr<9;rr++)for(let cc=0;cc<9;cc++){const p=board[rr][cc];if(p&&p.s===bySide&&pseudoMoves(rr,cc).some(m=>m.r===r&&m.c===c))return true;}return false;}
function kingPosition(side){for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(board[r][c]?.p==="K"&&board[r][c].s===side)return {r,c};return null;}
function kingSafe(side){const k=kingPosition(side);return !!k&&!isAttacked(k.r,k.c,side==="b"?"w":"b");}
function simulate(move,fn){const oldTurn=turn,oldHands=clone(hands),oldFrom=move.from?board[move.from.r][move.from.c]:null,oldTo=board[move.to.r][move.to.c];if(move.drop){const i=hands[move.side].indexOf(move.drop);if(i<0)return false;hands[move.side].splice(i,1);board[move.to.r][move.to.c]={p:move.drop,s:move.side};}else{if(!oldFrom||oldFrom.s!==move.side)return false;board[move.from.r][move.from.c]=null;board[move.to.r][move.to.c]={p:move.promote?"+"+base(oldFrom.p):oldFrom.p,s:oldFrom.s};}let result;try{result=fn();}finally{if(move.drop)board[move.to.r][move.to.c]=oldTo;else{board[move.from.r][move.from.c]=oldFrom;board[move.to.r][move.to.c]=oldTo;}hands=oldHands;turn=oldTurn;}return result;}
function rawDropMoves(p,s){const out=[],b=base(p);for(let r=0;r<9;r++)for(let c=0;c<9;c++){if(board[r][c])continue;if((b==="P"||b==="L")&&(s==="b"?r===0:r===8))continue;if(b==="N"&&(s==="b"?r<=1:r>=7))continue;if(b==="P"){let nifu=false;for(let rr=0;rr<9;rr++){const q=board[rr][c];if(q&&q.s===s&&base(q.p)==="P"&&!promoted(q.p)){nifu=true;break;}}if(nifu)continue;}out.push({from:null,to:{r,c},drop:p,side:s,promote:false});}return out;}
function allLegalMoves(side,checkPawnDropMate=true){const out=[];for(let r=0;r<9;r++)for(let c=0;c<9;c++){const piece=board[r][c];if(!piece||piece.s!==side)continue;for(const to of pseudoMoves(r,c)){if(board[to.r][to.c]?.p==="K")continue;const must=mandatory(piece.p,side,to.r);const can=canPromote(piece.p,side,r,to.r);const variants=promoted(piece.p)||!can?[false]:must?[true]:[false,true];for(const promoteChoice of variants){const m={from:{r,c},to:{r:to.r,c:to.c},side,promote:promoteChoice};if(simulate(m,()=>kingSafe(side)))out.push(m);}}
}for(const p of hands[side]){if(!p)continue;for(const m of rawDropMoves(p,side)){const legalDrop=simulate(m,()=>kingSafe(side));if(!legalDrop)continue;if(checkPawnDropMate&&base(p)==="P"&&simulate(m,()=>{const enemy=side==="b"?"w":"b";return isInCheck(enemy)&&!hasAnyLegalMove(enemy,false);})){continue;}out.push(m);}}return out;}
function hasAnyLegalMove(side,checkPawnDropMate=true){return allLegalMoves(side,checkPawnDropMate).length>0;}
function isInCheck(side){const k=kingPosition(side);return !!k&&isAttacked(k.r,k.c,side==="b"?"w":"b");}
function enteringKingPoints(side){let points=0,piecesInCamp=0;const king=kingPosition(side);if(!king)return {points:0,piecesInCamp:0,kingInCamp:false,kingSafe:false};const kingInCamp=side==="b"?king.r<=2:king.r>=6;if(!kingInCamp||isInCheck(side))return {points:0,piecesInCamp:0,kingInCamp,kingSafe:false};for(let r=0;r<9;r++)for(let c=0;c<9;c++){const p=board[r][c];if(!p||p.s!==side||p.p==="K")continue;const inCamp=side==="b"?r<=2:r>=6;if(inCamp){piecesInCamp++;points+=["R","B"].includes(base(p.p))?5:1;}}for(const p of hands[side])points+=["R","B"].includes(base(p))?5:1;return {points,piecesInCamp,kingInCamp,kingSafe:true};}
function canDeclareEnteringKing(side){const x=enteringKingPoints(side);return x.kingInCamp&&x.kingSafe&&x.piecesInCamp>=10&&x.points>=(side==="b"?28:27);}
function declareEnteringKing(){const side=localMode?turn:role;if(!gameStarted||gameOver||(!localMode&&turn!==role)){status("自分の番に入玉宣言できます。","bad");return;}if(!canDeclareEnteringKing(side)){const x=enteringKingPoints(side);status("入玉宣言の条件未達です（敵陣の駒 "+x.piecesInCamp+" 枚・点数 "+x.points+" 点）。玉が敵陣にあり、王手でなく、敵陣の駒10枚以上と"+(side==="b"?28:27)+"点以上が必要です。","bad");return;}if(localMode){gameOver={winner:side,reason:"入玉宣言成立"};gameStarted=false;render();status((side==="b"?"先手":"後手")+"の入玉宣言が成立しました。","good");}else if(side==="b"){gameOver={winner:"b",reason:"入玉宣言成立"};gameStarted=false;render();broadcastState();status("先手の入玉宣言が成立しました。","good");}else if(send({type:"declarationRequest",side:"w"})){status("入玉宣言を相手に確認しています…");}}
function sameMove(a,b){return !!a&&!!b&&a.side===b.side&&a.promote===b.promote&&a.drop===b.drop&&((!a.from&&!b.from)||(a.from&&b.from&&a.from.r===b.from.r&&a.from.c===b.from.c))&&a.to.r===b.to.r&&a.to.c===b.to.c;}
function validateAndApply(request,expectedSide){if(!request||request.side!==expectedSide||request.side!==turn||gameOver)return false;const legalMoves=allLegalMoves(expectedSide,true);const chosen=legalMoves.find(m=>sameMove(m,request));if(!chosen)return false;executeLegalMove(chosen);return true;}
function executeLegalMove(m){if(m.drop){const idx=hands[m.side].indexOf(m.drop);if(idx<0)return false;hands[m.side].splice(idx,1);board[m.to.r][m.to.c]={p:m.drop,s:m.side};}else{const p=board[m.from.r][m.from.c];if(!p||p.s!==m.side)return false;const captured=board[m.to.r][m.to.c];if(captured)hands[m.side].push(base(captured.p));board[m.to.r][m.to.c]={p:m.promote?"+"+base(p.p):p.p,s:p.s};board[m.from.r][m.from.c]=null;}lastMove={from:m.from?clone(m.from):null,to:clone(m.to)};turn=turn==="b"?"w":"b";moveNo++;selected=null;selectedHand=null;legal=[];const gaveCheck=isInCheck(turn);positionHistory.push({key:positionKey(),mover:m.side,gaveCheck});const currentKey=positionKey();const repeated=positionHistory.filter(x=>x.key===currentKey);if(repeated.length>=4){const firstIndex=positionHistory.findIndex(x=>x.key===currentKey);const interval=positionHistory.slice(firstIndex+1);const perpetual=["b","w"].find(side=>{const moves=interval.filter(x=>x.mover===side);return moves.length>0&&moves.every(x=>x.gaveCheck);});if(perpetual){gameOver={winner:perpetual==="b"?"w":"b",reason:"連続王手の千日手"};}else{gameOver={winner:null,reason:"千日手（引き分け）"};}}if(!gameOver&&!kingPosition(turn)){gameOver={winner:m.side,reason:"玉が盤上にありません"};}else if(!gameOver&&!hasAnyLegalMove(turn,true)){gameOver={winner:m.side,reason:isInCheck(turn)?"詰み":"合法手がありません"};}gameStarted=!gameOver;render();if(gameOver)status(gameOver.winner===null?"千日手により引き分けです。":(gameOver.winner==="b"?"先手":"後手")+"の勝ちです（"+gameOver.reason+"）。","good");else if(gaveCheck)status((turn==="b"?"先手":"後手")+"は王手です。","good");return true;}
function requestMove(m){if(localMode){if(validateAndApply(m,turn)){}return;}if(role==="b"){if(validateAndApply(m,"b"))broadcastState();}else if(role==="w"){if(send({type:"moveRequest",move:m})){status("指し手を送信しました。","good");}}}
function selectCell(r,c){if(!gameStarted||gameOver){status(gameOver?"対局は終了しています。盤面を初期化して再対局してください。":(localMode?"対面対局を開始してください。":"先にオンライン対局へ接続してください。"),"bad");return;}if(!localMode&&turn!==role){$("moveHint").textContent="相手の番です";return;}const piece=board[r][c];if(selectedHand){const dest=legal.find(m=>m.to.r===r&&m.to.c===c);if(dest){requestMove(dest);return;}if(piece&&piece.s===(localMode?turn:role)){selected={r,c};selectedHand=null;legal=allLegalMoves(localMode?turn:role).filter(m=>m.from&&m.from.r===r&&m.from.c===c);render();}return;}if(selected){const dests=legal.filter(m=>m.to.r===r&&m.to.c===c);if(dests.length){let chosen=dests[0];if(dests.length>1){const promoteChoice=confirm("成りますか？\n「OK」=成る / 「キャンセル」=成らない");chosen=dests.find(m=>m.promote===promoteChoice)||chosen;}requestMove(chosen);return;}}if(piece&&piece.s===(localMode?turn:role)){selected={r,c};selectedHand=null;legal=allLegalMoves(localMode?turn:role).filter(m=>m.from&&m.from.r===r&&m.from.c===c);render();}else{selected=null;legal=[];render();}}
function render(){const el=$("board");el.innerHTML="";for(let r=0;r<9;r++)for(let c=0;c<9;c++){const btn=document.createElement("button");btn.className="cell";btn.setAttribute("aria-label",(9-c)+"筋 "+(r+1)+"段");if(lastMove&&((lastMove.from&&lastMove.from.r===r&&lastMove.from.c===c)||(lastMove.to.r===r&&lastMove.to.c===c)))btn.classList.add("last");if(selected&&selected.r===r&&selected.c===c)btn.classList.add("selected");if(legal.some(m=>m.to.r===r&&m.to.c===c))btn.classList.add("legal");const p=board[r][c];if(p){const span=document.createElement("span");span.className="piece"+(p.s==="w"?" white":"")+(promoted(p.p)?" promoted":"");span.textContent=glyph[p.p]||p.p;btn.appendChild(span);}btn.onclick=()=>selectCell(r,c);el.appendChild(btn);}
for(const side of ["b","w"]){const h=$(side==="b"?"handB":"handW");h.innerHTML="";const counts={};hands[side].forEach(p=>counts[p]=(counts[p]||0)+1);const order=["R","B","G","S","N","L","P"];order.forEach(p=>{if(!counts[p])return;const b=document.createElement("button");b.textContent=names[p]+"×"+counts[p];b.disabled=!gameStarted||(!localMode&&(turn!==role||role!==side));b.classList.toggle("active",selectedHand===p);b.onclick=()=>{if(!gameStarted||(!localMode&&(turn!==role||role!==side)))return;selectedHand=p;selected=null;legal=allLegalMoves(localMode?turn:role).filter(m=>m.drop===p);render();};h.appendChild(b);});if(!h.children.length){const span=document.createElement("span");span.className="meta";span.textContent="なし";h.appendChild(span);}}
$("turnLabel").textContent=(turn==="b"?"先手":"後手")+"の番"+(gameStarted&&turn===role?"（あなた）":"");$("gameMeta").textContent=gameOver?("対局終了："+(gameOver.winner===null?"引き分け":(gameOver.winner==="b"?"先手":"後手")+"の勝ち")+"・"+gameOver.reason):gameStarted?(localMode?"対面対局中・第"+moveNo+"手":"第"+moveNo+"手・"+(role==="b"?"先手側":"後手側")):"相手と接続して対局開始";$("moveHint").textContent=selectedHand?names[selectedHand]+"を打つ場所を選択":selected?"移動先を選択":"自分の駒を選んで移動先をタップ";}
fresh();
})();
